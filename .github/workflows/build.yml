name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate package versions and release tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release.cjs version "$RELEASE_TAG"
      - run: node --test scripts/release-test.cjs
      - run: bash -n scripts/install.sh
      - run: shellcheck scripts/install.sh
  installer-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test terminal installer without installing software
        run: node --test scripts/install-test.cjs
  build:
    needs: [release-checks, installer-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev libasound2-dev libxcb1-dev libxcb-randr0-dev libpipewire-0.3-dev libclang-dev libgbm-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev libdbus-1-dev pulseaudio pulseaudio-utils xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Verify UI and native icons match the source artwork
        run: pnpm icons:check
      - name: Verify backlog publishing preserves triage
        if: runner.os == 'Linux'
        run: node scripts/backlog-test.cjs
      - name: Check studio UI and responsive layouts
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: pnpm test
      - run: pnpm check
      - name: Verify Linux audio and USB rules
        if: runner.os == 'Linux'
        run: |
          udevadm verify src-tauri/linux/69-dynamiclight.rules
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dynamiclight_test
          pactl set-default-sink dynamiclight_test
          cargo test --manifest-path src-tauri/Cargo.toml pulse_monitor_receives_samples_and_stops -- --ignored
          XDG_SESSION_TYPE=x11 xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml x11_capture_samples_display -- --ignored
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Verify Linux package contents and app startup
        if: runner.os == 'Linux'
        run: bash scripts/check-linux.sh
      - name: Stage desktop release assets
        run: node scripts/release.cjs stage ${{ matrix.target }} dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: dynamiclight-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: dynamiclight-*
          path: dist/release
          merge-multiple: true
      - name: Verify complete release and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.cjs assemble dist/release "$RELEASE_TAG"
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # A retry may finish a draft, but must never replace public binaries.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2> release-error.txt; then
            if ! jq -e '.isDraft == true' release-state.json >/dev/null; then
              echo 'Release is already published; leaving its assets unchanged.'
              exit 0
            fi
          else
            cat release-error.txt
            # --verify-tag prevents accidentally releasing the default branch.
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "DynamicLight $RELEASE_TAG" --generate-notes --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          fi
