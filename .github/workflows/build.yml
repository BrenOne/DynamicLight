name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev libasound2-dev libxcb1-dev libxcb-randr0-dev libpipewire-0.3-dev libclang-dev libgbm-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev libdbus-1-dev pulseaudio pulseaudio-utils xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: pnpm test
      - run: pnpm check
      - name: Verify Linux audio and USB rules
        if: runner.os == 'Linux'
        run: |
          udevadm verify src-tauri/linux/69-dynamiclight.rules
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dynamiclight_test
          pactl set-default-sink dynamiclight_test
          cargo test --manifest-path src-tauri/Cargo.toml pulse_monitor_receives_samples_and_stops -- --ignored
          XDG_SESSION_TYPE=x11 xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml x11_capture_samples_display -- --ignored
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Verify Linux package contents and app startup
        if: runner.os == 'Linux'
        run: bash scripts/check-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dynamiclight-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/69-dynamiclight.rules
          if-no-files-found: error
