name: Feature request
description: Propose an improvement to DynamicLight.
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User problem and desired outcome
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would make this complete?
