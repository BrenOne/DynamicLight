name: Bug report
description: Report a reproducible lighting, connection, or UI problem.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and app version
      placeholder: Windows 11, macOS 15, or Ubuntu 24.04 (X11) / DynamicLight 0.2.1
      description: On Linux, include your distribution and X11/Wayland session.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Controller and LED count
      description: Include VID/PID if known, but omit serial numbers.
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional details
      description: Remove private paths, screen contents, and identifiers before attaching logs.
