[package]
name = "dynamiclight"
version = "0.6.0"
description = "Local USB monitor backlight controller"
authors = ["mskutin"]
license = "MIT"
edition = "2021"
rust-version = "1.99"
default-run = "dynamiclight"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6.7"
xcap = "0.9.8"
cpal = "0.16"
rustfft = "6.4.1"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.17"
x11rb = { version = "0.13", features = ["dpms"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

