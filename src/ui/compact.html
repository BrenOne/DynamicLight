<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>DynamicLight · Quick controls</title><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="compact.css" /></head>
<body class="compact-body"><main class="quick-controls">
  <header><div class="brand"><img src="icon.svg" width="28" height="28" alt="" /><h1>DynamicLight</h1></div><button id="open-studio" class="text-button">Open studio ↗</button></header>
  <section class="quick-state" aria-label="Lighting state"><span id="quick-mode">Loading…</span><span id="quick-status" role="status">Connecting to app</span></section>
  <canvas id="quick-strip" width="600" height="20" aria-label="Outgoing LED colors"></canvas>
  <button id="quick-power" class="power" disabled>Start</button>
  <label for="quick-brightness">Brightness <output id="quick-value">—</output></label><input id="quick-brightness" type="range" min="0" max="100" disabled />
  <section class="quick-favorites" aria-labelledby="favorites-title"><h2 id="favorites-title">Favorites</h2><div id="quick-favorites"></div><p id="quick-empty" class="help">Add favorites in the studio’s Profiles section.</p></section>
  <p id="quick-error" role="status" class="help" hidden></p><button id="quick-retry" class="secondary" hidden>Retry</button>
  <footer><label class="checkbox"><input id="quick-pin" type="checkbox" /> Always on top</label><span id="quick-delivery" class="muted">USB idle</span></footer>
</main><script src="compact.js"></script></body></html>
