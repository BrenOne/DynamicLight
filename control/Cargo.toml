[package]
name = "dynamiclight-control"
version = "0.16.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"

[[bin]]
name = "dynamiclight"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Authorization"] }

[profile.release]
lto = "thin"
strip = true
